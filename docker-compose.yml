# =============================================================================
# Risk-Gated Agentic AML Monitoring PoC
# Docker Compose - Single database, two schemas (PRD §5.2)
# =============================================================================
#
# Usage:
#   docker compose up -d          # Start containers
#   docker compose down           # Stop containers
#   docker compose logs -f        # Follow logs
#   docker compose down -v        # Stop + delete volumes (RESETS ALL DATA)
#
# =============================================================================

services:
  postgres:
    image: postgres:16
    container_name: aml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: aml-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # n8n host config
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      # Encryption key for stored credentials (from .env)
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Database config - n8n uses its own schema
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n_internal
      # Execution data management
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      # Disable telemetry for local PoC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
